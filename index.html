<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .main_box {
        background-color: #e9e5cf;
        height: 620px;
      }
      .top_box {
        padding-top: 60px;
        margin-left: 130px;
      }
      a {
        text-decoration: none;
        padding: 100px;
      }
      .border_box {
        border: 2px solid black;
        height: 400px;
        width: 1200px;
        margin: 65px;
      }
      .img_box {
        float: right;
        padding: 10px;
        margin-top: -2px;
      }
      .text_box {
        margin-left: 70px;
      }
      h1 {
        font-size: 60px;
      }
      p {
        font-size: 25px;
      }
      .a {
        margin-top: 90px;
        font-size: 20px;
        margin-left: 70px;
      }
      .icons_box {
        margin-left: 70px;
      }
    </style>
  </head>
  <body>
    <div class="main_box">
      <div class="top_box">
        <a href="">BIO</a>
        <a href="">PORTFOLIO</a>
        <a href="">PODCAST</a>
        <a href="">BLOG</a>
      </div>
      <div class="border_box">
        <div class="img_box">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTB5pjPCnJgClDse98_JuRVvCmi6t0Poc9Vl0iOhTvNWQ&s=10"
            alt="girl eating ice cream"
            height="380px"
            width="500px"
          />
        </div>
        <div class="content_box">
          <div class="text_box">
            <h1>Bethany Jones</h1>
            <p>
              I'm a dedicated culture critic and blogger <br />
              located in San Francisco, California.
            </p>
          </div>
          <div class="logo_box">
            <p class="a">@reallygreatsite</p>
            <div class="icons_box">
              <img
                src="https://assets.streamlinehq.com/image/private/w_240,h_240,ar_1/f_auto/v1/icons/logo/instagram-logo-i8m1gphmzwyfw22g0xdy.png/instagram-logo-52glddxszoh3pbwuo3z8fd.png"
                alt="Instagram "
                height="40px"
                width="40px"
            >
              <img src="https://cdn-icons-png.flaticon.com/512/59/59439.png" alt="Facebook" height="40px"
                width="40px">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25660.png" alt="Twitter"height="40px"
                width="40px">
                <img src="https://i.pinimg.com/564x/6b/ab/30/6bab3017350ca04c6fa05569672bd31e.jpg" alt="LinkedIn" height="40px"
                width="40px">
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
